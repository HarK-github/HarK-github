<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1350" viewBox="0 0 1000 1350">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0D1117;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#161B22;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1C2333;stop-opacity:0.9" />
      <stop offset="100%" style="stop-color:#0D1117;stop-opacity:0.95" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#6A0DAD" />
      <stop offset="100%" style="stop-color:#9B4DCA" />
    </linearGradient>
    <linearGradient id="purpleGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6A0DAD;stop-opacity:0.3" />
      <stop offset="100%" style="stop-color:#9B4DCA;stop-opacity:0.05" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="shadow">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#6A0DAD" flood-opacity="0.3"/>
    </filter>
    <clipPath id="avatarClip">
      <circle cx="75" cy="75" r="65" />
    </clipPath>
  </defs>

  <!-- Background -->
  <rect width="1000" height="1350" fill="url(#bgGrad)" rx="20" />

  <!-- Title Bar -->
  <rect x="30" y="25" width="940" height="80" rx="16" fill="url(#cardGrad)" stroke="#6A0DAD" stroke-width="1.5" filter="url(#shadow)" />
  <text x="500" y="72" font-family="'Fira Code', monospace" font-size="32" fill="#FFFFFF" text-anchor="middle" font-weight="bold">
    ✦ Harshit Kandpal ✦
  </text>
  <rect x="250" y="78" width="500" height="2" fill="url(#accentGrad)" />

  <!-- ==================== BENTO GRID ==================== -->

  <!-- Row 1: Avatar + Typing -->
  <!-- Box 1: Avatar (2 cols) -->
  <rect x="30" y="125" width="180" height="200" rx="16" fill="url(#cardGrad)" stroke="#6A0DAD" stroke-width="1" filter="url(#shadow)" />
  <circle cx="120" cy="170" r="65" fill="url(#bgGrad)" stroke="url(#accentGrad)" stroke-width="3" filter="url(#glow)" />
  <image href="https://avatars.githubusercontent.com/u/171217644" x="55" y="105" width="130" height="130" clip-path="url(#avatarClip)" />
  <text x="120" y="295" font-family="'Fira Code', monospace" font-size="14" fill="#6A0DAD" text-anchor="middle">@Hark-github</text>

  <!-- Box 2: Typing Roles (4 cols) -->
  <rect x="225" y="125" width="400" height="200" rx="16" fill="url(#cardGrad)" stroke="#9B4DCA" stroke-width="1" filter="url(#shadow)" />
  <text x="425" y="175" font-family="'Fira Code', monospace" font-size="26" fill="#FFFFFF" text-anchor="middle" font-weight="bold">
    Developer
  </text>
  <text x="425" y="215" font-family="'Fira Code', monospace" font-size="22" fill="#9B4DCA" text-anchor="middle" opacity="0.9">
